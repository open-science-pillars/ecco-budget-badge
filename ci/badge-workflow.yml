# Adopter snippet: attach the "closes the budget" badge to a repo.
# Requires: your notebook or script writes receipt.json (the executor
# contract from the ECCO heat budget Attested Computation concept),
# from a data tree the verify tool has stamped with RECORD.json.
name: ecco-budget-attestation
on: [push, workflow_dispatch]
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sanctioned computation and attester (pinned)
        run: |
          git clone --depth 1 --branch v2 https://github.com/open-science-pillars/ecco-budget-badge tooling
      - name: Run budget and produce receipt
        run: python run_budget.py --receipt receipt.json   # your executor
      - name: Attest
        run: |
          python tooling/ecco_budget_badge.py receipt.json \
            --computation tooling/computations/ecco_heat_budget.py \
            --attester tooling/attesters/budget_residual.py \
            --badge .badges/ecco-budget.json --label "ecco heat budget"
      - name: Publish badge JSON
        uses: EndBug/add-and-commit@v9
        with: { add: ".badges/ecco-budget.json", message: "update budget badge" }
# README badge line:
# ![ecco budget](https://img.shields.io/endpoint?url=<raw-url-to-.badges/ecco-budget.json>)
